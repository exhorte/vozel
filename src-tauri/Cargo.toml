[package]
name = "vozel"
version = "0.1.0"
description = "Vozel - dicte vocale IA cross-app"
authors = ["ExponentValue"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vozel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
global-hotkey = "0.7"
cpal = "0.15"
crossbeam-channel = "0.5"
ort = { version = "2.0.0-rc.13", features = ["ndarray", "download-binaries"] }
ndarray = "0.17.2"
regex = "1.13.1"
enigo = "0.6.1"
arboard = { version = "3.6.1", default-features = false }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
# Client HTTP bloquant pour le moteur ASR cloud (Spec_Backend_Desktop.md §2.4).
# `ureq` (sync, sans runtime) plutôt que `reqwest` : `AsrEngine::transcribe`
# est synchrone et `run_pipeline` tourne déjà sur un thread bloquant — pas de
# risque de bloquer un runtime async. Multipart construit à la main (un champ
# + un fichier, trivial). Voir PROGRESS.md.
ureq = "3"
# Tokeniseur pour le LLM local (§2.3) : lit un `tokenizer.json` Hugging Face.
# `default-features = false` + `fancy-regex` (pur Rust) : pas de `onig` (C),
# pas d'`esaxx_fast` (C++), pas de `hf-hub`/réseau. Voir PROGRESS.md Session 9.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

# Accès Win32 direct. Auparavant `dev-dependency` seulement (helpers de test
# d'injection) ; promu en dépendance normale (ciblée Windows) pour le hook
# clavier bas niveau `WH_KEYBOARD_LL` du push-to-talk Ctrl+Win seul
# (Spec_Backend_Desktop.md §2.5) — la spec supposait `windows` déjà
# dépendance, elle ne l'était qu'en dev. `Win32_UI_Input_KeyboardAndMouse`
# ajoutée pour les constantes `VK_*` ; `Win32_System_LibraryLoader` pour
# `GetModuleHandleW` (hmod du hook). Reste dispo pour les tests (les
# dépendances normales le sont aussi en `#[cfg(test)]`).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
hound = "3.5.1"

